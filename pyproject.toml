[project]
name = "booktr"
version = "0.1.0"
description = "Překlad knih do češtiny — jednoduchá aplikace pro tátu"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "typst>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booktr = ["assets/*.typ"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
