name: build-windows

on:
  pull_request:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: booktr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m booktr --self-test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller

      - run: pyinstaller build/booktr.spec

      - name: Verify packaged PDF and audiobook tools
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/BookTr.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "BookTr packaged self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: BookTr-windows
          path: dist/BookTr.exe
